name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Audit Python dependencies
        run: pip-audit

      - name: Test with coverage gate
        run: pytest --cov=voice_ai_deployment_lab --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag voice-ai-deployment-lab:${{ github.sha }} .

      - name: Smoke-test container
        run: |
          docker run --detach --name voice-lab --publish 8080:8080 voice-ai-deployment-lab:${{ github.sha }}
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          docker logs voice-lab
          exit 1

